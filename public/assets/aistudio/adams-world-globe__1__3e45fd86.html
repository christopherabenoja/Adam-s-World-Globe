<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1a3f">
<title>Adam's World Globe</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
  body {
    font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; color: #fff;
    background: radial-gradient(ellipse at 50% 40%, #1b2f6b 0%, #0a1a3f 55%, #050c22 100%);
    display: flex; flex-direction: column;
  }
  #stars { position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(2px 2px at 10% 20%, #fff8, transparent), radial-gradient(1.5px 1.5px at 80% 10%, #fff9, transparent),
      radial-gradient(2px 2px at 70% 80%, #fff7, transparent), radial-gradient(1.5px 1.5px at 25% 70%, #fff8, transparent),
      radial-gradient(2px 2px at 90% 55%, #fff6, transparent), radial-gradient(1.5px 1.5px at 45% 12%, #fff9, transparent),
      radial-gradient(1.5px 1.5px at 5% 90%, #fff7, transparent), radial-gradient(2px 2px at 55% 92%, #fff6, transparent); }
  header { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 14px 0; position: relative; z-index: 2; }
  h1 { margin: 0; font-size: clamp(20px, 3.4vw, 32px); letter-spacing: .5px; flex: 1; text-shadow: 0 3px 0 #0006; }
  .rb { border: 0; border-radius: 999px; font-family: inherit; font-weight: 800; font-size: clamp(16px, 2.4vw, 22px);
    padding: 10px 18px; color: #1a1a1a; background: #FFD23F; box-shadow: 0 5px 0 #b8901a; cursor: pointer; }
  .rb:active { transform: translateY(4px); box-shadow: 0 1px 0 #b8901a; }
  .ic { background: #ffffff22; color: #fff; box-shadow: 0 4px 0 #0005; width: 52px; height: 52px; padding: 0; font-size: 24px; }
  main { flex: 1; position: relative; min-height: 0; }
  #globe { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #zoom { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; z-index: 2; }
  #zoom .rb { width: 58px; height: 58px; padding: 0; font-size: 32px; background: #ffffff; box-shadow: 0 5px 0 #8aa; }

  #bar { display: flex; gap: 8px; padding: 8px 10px calc(12px + env(safe-area-inset-bottom)); overflow-x: auto; z-index: 2; position: relative; }
  .cbtn { flex: 1 0 auto; min-width: 104px; border: 0; border-radius: 22px; padding: 8px 10px 10px; background: var(--c);
    color: #1a1a1a; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
    box-shadow: 0 6px 0 #0006, inset 0 -4px 0 #0002; transition: transform .1s; }
  .cbtn:active { transform: translateY(5px); box-shadow: 0 1px 0 #0006; }
  .cbtn.on { outline: 5px solid #fff; transform: translateY(-4px); }
  .cbtn .em { font-size: clamp(22px, 3.2vw, 30px); line-height: 1.1; }
  .cbtn .nm { font-weight: 800; font-size: clamp(14px, 1.9vw, 19px); white-space: nowrap; }

  #card { position: absolute; left: 14px; top: 14px; width: min(340px, 44vw); background: #fff; color: #1a1a1a; border-radius: 26px;
    padding: 16px 18px 18px; border: 7px solid var(--c, #FFD23F); box-shadow: 0 12px 30px #0008; z-index: 3;
    transform: translateX(-120%) rotate(-4deg); transition: transform .45s cubic-bezier(.3,1.5,.5,1); }
  #card.show { transform: none; }
  #cName { margin: 0; font-size: clamp(28px, 4.4vw, 44px); line-height: 1; }
  #cSub { font-weight: 700; color: #666; font-size: 18px; min-height: 4px; }
  #cAnimals { font-size: clamp(36px, 5.5vw, 54px); letter-spacing: 4px; margin: 6px 0; }
  #cFacts { margin: 0 0 12px; padding-left: 22px; font-size: clamp(16px, 2.1vw, 20px); line-height: 1.35; }
  #cFacts li { margin-bottom: 4px; }
  #cFacts li.tip { list-style: none; margin-left: -22px; color: #0B4FA8; font-weight: 700; }
  .chip { display: inline-block; padding: 2px 12px; border-radius: 999px; color: #1a1a1a; font-weight: 800; }
  #card.country #cAnimals { font-size: clamp(56px, 8vw, 80px); line-height: 1.1; }
  #card.country #cName { font-size: clamp(26px, 3.8vw, 38px); }
  #card .row { display: flex; gap: 10px; }
  #card .rb { flex: 1; }
  #cClose { background: #eee; box-shadow: 0 5px 0 #bbb; flex: 0 0 auto !important; }

  #prompt { position: absolute; left: 50%; top: 10px; transform: translate(-50%, -150%); z-index: 3; background: #fff; color: #1a1a1a;
    border-radius: 999px; padding: 12px 26px; font-weight: 800; font-size: clamp(22px, 3.6vw, 36px); box-shadow: 0 8px 0 #0005;
    visibility: hidden; transition: transform .4s cubic-bezier(.3,1.5,.5,1), visibility 0s .4s; white-space: nowrap; text-align: center; }
  #prompt.show { transform: translate(-50%, 0); visibility: visible; transition: transform .4s cubic-bezier(.3,1.5,.5,1); }
  #prompt b { -webkit-text-stroke: 1.5px #0005; }
  #prompt .stars { display: block; font-size: .6em; min-height: 1.2em; }
  body.playing #card { display: none; }
  #toast { position: fixed; left: 50%; bottom: 120px; transform: translate(-50%, 30px); opacity: 0; z-index: 6; max-width: 92vw;
    background: #1a1a1a; color: #fff; padding: 14px 20px; border-radius: 18px; font-size: clamp(15px, 2vw, 19px); font-weight: 700;
    box-shadow: 0 8px 24px #0008; transition: .3s; pointer-events: none; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 5; width: 100%; height: 100%; }

  @media (max-width: 700px), (max-height: 520px) {
    #card { width: auto; right: 80px; top: auto; bottom: 8px; padding: 10px 14px; }
    #cAnimals { margin: 2px 0; }
    #prompt { white-space: normal; width: 90vw; }
  }
</style>
</head>
<body>
<div id="stars"></div>
<header>
  <h1>🌍 Adam's World</h1>
  <button class="rb" id="gameBtn">⭐ Find it!</button>
  <button class="rb ic" id="snd" aria-label="Sound">🔊</button>
  <button class="rb ic" id="fs" aria-label="Full screen">⛶</button>
</header>
<main>
  <canvas id="globe"></canvas>
  <div id="zoom"><button class="rb" id="zin" aria-label="Zoom in">+</button><button class="rb" id="zout" aria-label="Zoom out">−</button></div>
  <div id="prompt"></div>
  <div id="card">
    <h2 id="cName"></h2><div id="cSub"></div>
    <div id="cAnimals"></div>
    <ul id="cFacts"></ul>
    <div class="row"><button class="rb" id="cSay">🔊 Tell me!</button><button class="rb" id="cClose" aria-label="Close">✕</button></div>
  </div>
</main>
<nav id="bar"></nav>
<div id="toast" role="status"></div>
<canvas id="fx"></canvas>
